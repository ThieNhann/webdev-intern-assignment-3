version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gscores_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: gscores
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./exam-api
    container_name: gscores_backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: gscores
    depends_on:
      - postgres

  frontend:
    build: ./exam-web
    container_name: gscores_frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata: